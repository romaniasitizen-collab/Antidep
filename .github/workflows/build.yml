name: Build AntiDep APK

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.5'

      - name: Generate Android Project Files
        run: |
          mkdir -p app/src/main/java/com/example/antidep
          mkdir -p app/src/main/res/layout
          mkdir -p app/src/main/res/xml
          mkdir -p app/src/main/res/drawable

          cat << 'EOF' > settings.gradle
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }
          rootProject.name = "AntiDep"
          include ':app'
          EOF

          cat << 'EOF' > build.gradle
          plugins {
              id 'com.android.application' version '8.2.2' apply false
              id 'org.jetbrains.kotlin.android' version '1.9.22' apply false
          }
          EOF

          cat << 'EOF' > gradle.properties
          org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
          android.useAndroidX=true
          EOF

          cat << 'EOF' > app/build.gradle
          plugins {
              id 'com.android.application'
              id 'org.jetbrains.kotlin.android'
          }

          android {
              namespace 'com.example.antidep'
              compileSdk 34

              defaultConfig {
                  applicationId "com.example.antidep"
                  minSdk 26
                  targetSdk 34
                  versionCode 4
                  versionName "1.3"
              }

              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }
              kotlinOptions {
                  jvmTarget = '17'
              }
          }
          EOF

          cat << 'EOF' > app/src/main/AndroidManifest.xml
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <application
                  android:label="AntiDep $"
                  android:theme="@android:style/Theme.DeviceDefault.NoActionBar">
                  <activity
                      android:name=".MainActivity"
                      android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>

                  <receiver
                      android:name=".SavingsWidget"
                      android:exported="true">
                      <intent-filter>
                          <action android:name="android.appwidget.action.APPWIDGET_UPDATE" />
                      </intent-filter>
                      <meta-data
                          android:name="android.appwidget.provider"
                          android:resource="@xml/savings_widget_info" />
                  </receiver>
              </application>
          </manifest>
          EOF

          cat << 'EOF' > app/src/main/res/drawable/widget_bg.xml
          <?xml version="1.0" encoding="utf-8"?>
          <shape xmlns:android="http://schemas.android.com/apk/res/android"
              android:shape="rectangle">
              <solid android:color="#EE161618" />
              <corners android:radius="20dp" />
              <stroke android:width="1.5dp" android:color="#4D00E676" />
          </shape>
          EOF

          cat << 'EOF' > app/src/main/res/xml/savings_widget_info.xml
          <?xml version="1.0" encoding="utf-8"?>
          <appwidget-provider xmlns:android="http://schemas.android.com/apk/res/android"
              android:minWidth="160dp"
              android:minHeight="80dp"
              android:updatePeriodMillis="1800000"
              android:initialLayout="@layout/widget_savings"
              android:resizeMode="horizontal|vertical"
              android:widgetCategory="home_screen" />
          EOF

          cat << 'EOF' > app/src/main/res/layout/widget_savings.xml
          <?xml version="1.0" encoding="utf-8"?>
          <LinearLayout xmlns:android="http://schemas.android.com/apk/res/android"
              android:id="@+id/widgetRoot"
              android:layout_width="match_parent"
              android:layout_height="match_parent"
              android:orientation="vertical"
              android:gravity="center"
              android:padding="12dp"
              android:background="@drawable/widget_bg">

              <TextView
                  android:layout_width="wrap_content"
                  android:layout_height="wrap_content"
                  android:text="БЕЗ ДЕПОВ"
                  android:textColor="#9E9E9E"
                  android:textSize="11sp"
                  android:textStyle="bold" />

              <TextView
                  android:id="@+id/tvWidgetMoney"
                  android:layout_width="wrap_content"
                  android:layout_height="wrap_content"
                  android:text="Сэкономлено - 40$"
                  android:textColor="#00E676"
                  android:textSize="20sp"
                  android:textStyle="bold"
                  android:layout_marginTop="4dp"
                  android:layout_marginBottom="2dp" />

              <TextView
                  android:id="@+id/tvWidgetSub"
                  android:layout_width="wrap_content"
                  android:layout_height="wrap_content"
                  android:text="Тариф: 20$ / день"
                  android:textColor="#CCCCCC"
                  android:textSize="12sp" />
          </LinearLayout>
          EOF

          cat << 'EOF' > app/src/main/res/layout/activity_main.xml
          <?xml version="1.0" encoding="utf-8"?>
          <LinearLayout xmlns:android="http://schemas.android.com/apk/res/android"
              android:layout_width="match_parent"
              android:layout_height="match_parent"
              android:orientation="vertical"
              android:padding="24dp"
              android:gravity="center"
              android:background="#121214">

              <TextView
                  android:id="@+id/tvPreview"
                  android:layout_width="wrap_content"
                  android:layout_height="wrap_content"
                  android:text="Сэкономлено - 40$"
                  android:textColor="#00E676"
                  android:textSize="26sp"
                  android:textStyle="bold"
                  android:layout_marginBottom="32dp" />

              <TextView
                  android:layout_width="match_parent"
                  android:layout_height="wrap_content"
                  android:text="Сумма экономии в день ($):"
                  android:textColor="#AAAAAA"
                  android:textSize="14sp" />

              <EditText
                  android:id="@+id/etDailyAmount"
                  android:layout_width="match_parent"
                  android:layout_height="wrap_content"
                  android:inputType="number"
                  android:textColor="#FFFFFF"
                  android:textSize="20sp"
                  android:layout_marginBottom="20dp" />

              <TextView
                  android:layout_width="match_parent"
                  android:layout_height="wrap_content"
                  android:text="Какой сегодня день по счету:"
                  android:textColor="#AAAAAA"
                  android:textSize="14sp" />

              <EditText
                  android:id="@+id/etCurrentDays"
                  android:layout_width="match_parent"
                  android:layout_height="wrap_content"
                  android:inputType="number"
                  android:textColor="#FFFFFF"
                  android:textSize="20sp"
                  android:layout_marginBottom="28dp" />

              <Button
                  android:id="@+id/btnSave"
                  android:layout_width="match_parent"
                  android:layout_height="56dp"
                  android:text="СОХРАНИТЬ И ОБНОВИТЬ"
                  android:backgroundTint="#00C853"
                  android:textColor="#FFFFFF" />

              <Button
                  android:id="@+id/btnReset"
                  android:layout_width="match_parent"
                  android:layout_height="48dp"
                  android:layout_marginTop="14dp"
                  android:text="Сбросить на 1-й день"
                  android:backgroundTint="#2C2C2E"
                  android:textColor="#FF5252" />
          </LinearLayout>
          EOF

          cat << 'EOF' > app/src/main/java/com/example/antidep/SavingsWidget.kt
          package com.example.antidep

          import android.app.PendingIntent
          import android.appwidget.AppWidgetManager
          import android.appwidget.AppWidgetProvider
          import android.content.Context
          import android.content.Intent
          import android.widget.RemoteViews

          class SavingsWidget : AppWidgetProvider() {

              override fun onUpdate(
                  context: Context,
                  appWidgetManager: AppWidgetManager,
                  appWidgetIds: IntArray
              ) {
                  for (appWidgetId in appWidgetIds) {
                      updateAppWidget(context, appWidgetManager, appWidgetId)
                  }
              }

              companion object {
                  fun updateAppWidget(
                      context: Context,
                      appWidgetManager: AppWidgetManager,
                      appWidgetId: Int
                  ) {
                      val prefs = context.getSharedPreferences("AntiDepPrefs", Context.MODE_PRIVATE)
                      val dailyAmount = prefs.getInt("daily_amount", 20)
                      val startTime = prefs.getLong("start_time", System.currentTimeMillis() - 86400000L)

                      val daysPassed = ((System.currentTimeMillis() - startTime) / 86400000L).toInt().coerceAtLeast(0)
                      val totalSaved = daysPassed * dailyAmount

                      val views = RemoteViews(context.packageName, R.layout.widget_savings)
                      views.setTextViewText(R.id.tvWidgetMoney, "Сэкономлено - " + totalSaved + "$")
                      views.setTextViewText(R.id.tvWidgetSub, "Тариф: " + dailyAmount + "$ / день")

                      val intent = Intent(context, MainActivity::class.java)
                      val pendingIntent = PendingIntent.getActivity(
                          context, 0, intent,
                          PendingIntent.FLAG_UPDATE_CURRENT or PendingIntent.FLAG_IMMUTABLE
                      )
                      views.setOnClickPendingIntent(R.id.widgetRoot, pendingIntent)

                      appWidgetManager.updateAppWidget(appWidgetId, views)
                  }
              }
          }
          EOF

          cat << 'EOF' > app/src/main/java/com/example/antidep/MainActivity.kt
