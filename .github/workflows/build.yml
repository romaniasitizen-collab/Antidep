                  val etDailyAmount = findViewById<EditText>(R.id.etDailyAmount)
                  val etCurrentDays = findViewById<EditText>(R.id.etCurrentDays)
                  val btnSave = findViewById<Button>(R.id.btnSave)
                  val btnReset = findViewById<Button>(R.id.btnReset)

                  fun refreshUI() {
                      val savedAmount = prefs.getInt("daily_amount", 20)
                      val startTime = prefs.getLong("start_time", System.currentTimeMillis() - 86400000L)
                      val currentDays = ((System.currentTimeMillis() - startTime) / 86400000L).toInt().coerceAtLeast(0)
                      val total = currentDays * savedAmount

                      etDailyAmount.setText(savedAmount.toString())
                      etCurrentDays.setText(currentDays.toString())
