name: Build AntiDep APK
on: [push, workflow_dispatch]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.5'

      - name: Create And Build
        run: |
          mkdir -p app/src/main/java/com/example/antidep app/src/main/res/layout app/src/main/res/xml

          cat << 'EOF' > settings.gradle
          pluginManagement { repositories { google(); mavenCentral(); gradlePluginPortal() } }
          dependencyResolutionManagement { repositories { google(); mavenCentral() } }
          rootProject.name = "AntiDep"
          include ':app'
          EOF

          cat << 'EOF' > build.gradle
          plugins { id 'com.android.application' version '8.2.2' apply false }
          EOF

          cat << 'EOF' > app/build.gradle
          plugins { id 'com.android.application' }
          android {
              namespace 'com.example.antidep'
              compileSdk 34
              defaultConfig {
                  applicationId "com.example.antidep"
                  minSdk 26
                  targetSdk 34
                  versionCode 11
                  versionName "2.1"
              }
              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }
          }
          EOF

          cat << 'EOF' > app/src/main/AndroidManifest.xml
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <application android:label="AntiDep $" android:theme="@android:style/Theme.DeviceDefault.NoActionBar">
                  <activity android:name=".MainActivity" android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
                  <receiver android:name=".SavingsWidget" android:exported="true">
                      <intent-filter>
                          <action android:name="android.appwidget.action.APPWIDGET_UPDATE" />
                      </intent-filter>
                      <meta-data android:name="android.appwidget.provider" android:resource="@xml/w_info" />
                  </receiver>
              </application>
          </manifest>
          EOF

          cat << 'EOF' > app/src/main/res/xml/w_info.xml
          <?xml version="1.0" encoding="utf-8"?>
          <appwidget-provider xmlns:android="http://schemas.android.com/apk/res/android"
              android:minWidth="140dp" android:minHeight="70dp"
              android:updatePeriodMillis="1800000"
              android:initialLayout="@layout/w_layout"
              android:resizeMode="horizontal|vertical"
              android:widgetCategory="home_screen" />
          EOF

          cat << 'EOF' > app/src/main/res/layout/w_layout.xml
          <?xml version="1.0" encoding="utf-8"?>
          <LinearLayout xmlns:android="http://schemas.android.com/apk/res/android"
              android:id="@+id/root"
              android:layout_width="match_parent"
              android:layout_height="match_parent"
              android:orientation="vertical"
              android:gravity="center"
              android:padding="14dp"
              android:background="#E61A1A1A">
              <TextView
                  android:layout_width="wrap_content"
                  android:layout_height="wrap_content"
                  android:text="БЕЗ ДЕПОВ"
                  android:textColor="#888888"
                  android:textSize="11sp"
                  android:textStyle="bold" />
              <TextView
                  android:id="@+id/tvMoney"
                  android:layout_width="wrap_content"
                  android:layout_height="wrap_content"
                  android:text="Сэкономлено - 40$"
                  android:textColor="#00E676"
                  android:textSize="22sp"
                  android:textStyle="bold"
                  android:layout_marginTop="4dp" />
          </LinearLayout>
          EOF

          cat << 'EOF' > app/src/main/res/layout/a_main.xml
          <?xml version="1.0" encoding="utf-8"?>
          <LinearLayout xmlns:android="http://schemas.android.com/apk/res/android"
              android:layout_width="match_parent"
              android:layout_height="match_parent"
              android:orientation="vertical"
              android:gravity="center"
              android:padding="24dp"
              android:background="#121212">
              <TextView
                  android:id="@+id/tvPre"
                  android:layout_width="wrap_content"
                  android:layout_height="wrap_content"
                  android:text="Сэкономлено - 40$"
                  android:textColor="#00E676"
                  android:textSize="26sp"
                  android:textStyle="bold"
                  android:layout_marginBottom="24dp" />
              <TextView
                  android:layout_width="match_parent"
                  android:layout_height="wrap_content"
                  android:text="Сумма в день ($):"
                  android:textColor="#888888" />
              <EditText
                  android:id="@+id/etAmt"
                  android:layout_width="match_parent"
                  android:layout_height="wrap_content"
                  android:inputType="number"
                  android:textColor="#FFFFFF"
                  android:layout_marginBottom="16dp" />
              <TextView
                  android:layout_width="match_parent"
                  android:layout_height="wrap_content"
                  android:text="День по счету (считается сам):"
                  android:textColor="#888888" />
              <EditText
                  android:id="@+id/etDays"
                  android:layout_width="match_parent"
                  android:layout_height="wrap_content"
                  android:inputType="number"
                  android:textColor="#FFFFFF"
                  android:layout_marginBottom="24dp" />
              <Button
                  android:id="@+id/btnS"
                  android:layout_width="match_parent"
                  android:layout_height="52dp"
                  android:text="СОХРАНИТЬ"
                  android:backgroundTint="#00E676"
                  android:textColor="#000000" />
              <Button
                  android:id="@+id/btnR"
                  android:layout_width="match_parent"
                  android:layout_height="44dp"
                  android:layout_marginTop="12dp"
                  android:text="Сбросить на 1 день"
                  android:backgroundTint="#2C2C2E"
                  android:textColor="#FF5252" />
          </LinearLayout>
          EOF

          cat << 'EOF' > app/src/main/java/com/example/antidep/MainActivity.java
          package com.example.antidep;
          import android.app.Activity;
          import android.appwidget.AppWidgetManager;
          import android.content.ComponentName;
          import android.content.Context;
          import android.content.Intent;
          import android.content.SharedPreferences;
          import android.os.Bundle;
          import android.widget.Button;
          import android.widget.EditText;
          import android.widget.TextView;
          import android.widget.Toast;

          public class MainActivity extends Activity {
              @Override
              protected void onCreate(Bundle b) {
                  super.onCreate(b);
                  setContentView(R.layout.a_main);
                  SharedPreferences p = getSharedPreferences("AntiDepPrefs", Context.MODE_PRIVATE);
                  TextView tv = findViewById(R.id.tvPre);
                  EditText ea = findViewById(R.id.etAmt);
                  EditText ed = findViewById(R.id.etDays);

                  findViewById(R.id.btnS).setOnClickListener(v -> {
                      int amt = ea.getText().toString().isEmpty() ? 20 : Integer.parseInt(ea.getText().toString());
                      long d = ed.getText().toString().isEmpty() ? 1L : Long.parseLong(ed.getText().toString());
                      p.edit().putInt("amt", amt).putLong("start", System.currentTimeMillis() - (d * 86400000L)).apply();
                      upd(p, tv, ea, ed);
                      updW();
                      Toast.makeText(this, "Обновлено!", Toast.LENGTH_SHORT).show();
                  });

                  findViewById(R.id.btnR).setOnClickListener(v -> {
                      int amt = ea.getText().toString().isEmpty() ? 20 : Integer.parseInt(ea.getText().toString());
                      p.edit().putInt("amt", amt).putLong("start", System.currentTimeMillis() - 86400000L).apply();
                      upd(p, tv, ea, ed);
                      updW();
                      Toast.makeText(this, "Сброшено!", Toast.LENGTH_SHORT).show();
                  });

                  upd(p, tv, ea, ed);
              }

              void upd(SharedPreferences p, TextView tv, EditText ea, EditText ed) {
                  int amt = p.getInt("amt", 20);
                  long st = p.getLong("start", System.currentTimeMillis() - 86400000L);
                  int d = (int) Math.max(0, (System.currentTimeMillis() - st) / 86400000L);
                  ea.setText(String.valueOf(amt));
                  ed.setText(String.valueOf(d));
                  tv.setText("Сэкономлено - " + (d * amt) + "$");
              }

              void updW() {
                  Intent i = new Intent(this, SavingsWidget.class);
                  i.setAction(AppWidgetManager.ACTION_APPWIDGET_UPDATE);
                  i.putExtra(AppWidgetManager.EXTRA_APPWIDGET_IDS, AppWidgetManager.getInstance(this).getAppWidgetIds(new ComponentName(this, SavingsWidget.class)));
                  sendBroadcast(i);
              }
          }
          EOF

          cat << 'EOF' > app/src/main/java/com/example/antidep/SavingsWidget.java
          package com.example.antidep;
          import android.app.PendingIntent;
          import android.appwidget.AppWidgetManager;
          import android.appwidget.AppWidgetProvider;
          import android.content.Context;
          import android.content.Intent;
          import android.content.SharedPreferences;
          import android.widget.RemoteViews;

          public class SavingsWidget extends AppWidgetProvider {
              @Override
              public void onUpdate(Context c, AppWidgetManager m, int[] ids) {
                  SharedPreferences p = c.getSharedPreferences("AntiDepPrefs", Context.MODE_PRIVATE);
                  int amt = p.getInt("amt", 20);
                  long st = p.getLong("start", System.currentTimeMillis() - 86400000L);
                  int d = (int) Math.max(0, (System.currentTimeMillis() - st) / 86400000L);
                  for (int id : ids) {
                      RemoteViews v = new RemoteViews(c.getPackageName(), R.layout.w_layout);
                      v.setTextViewText(R.id.tvMoney, "Сэкономлено - " + (d * amt) + "$");
                      Intent intent = new Intent(c, MainActivity.class);
                      PendingIntent pi = PendingIntent.getActivity(c, 0, intent, PendingIntent.FLAG_UPDATE_CURRENT | PendingIntent.FLAG_IMMUTABLE);
                      v.setOnClickPendingIntent(R.id.root, pi);
                      m.updateAppWidget(id, v);
                  }
              }
          }
          EOF

          gradle assembleDebug

      - uses: actions/upload-artifact@v4
        with:
          name: AntiDep-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          
